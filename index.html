<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Abie &amp; Alton's Wedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ════════════════════════════════════════
     CAMERA SCREEN
════════════════════════════════════════ -->
    <div id="camera-screen" class="screen">
      <div id="viewfinder-wrap">
        <video id="video" autoplay playsinline muted></video>

        <div class="cam-hud">
          <div class="cam-title" id="cam-title"></div>
          <div class="cam-counter" id="shot-counter">0 shots</div>
        </div>

        <div class="rec-badge" id="rec-badge">
          <div class="rec-dot"></div>
          <div class="rec-label">REC</div>
        </div>
      </div>

      <div class="cam-controls">
        <!-- Flip camera -->
        <button
          class="cam-side-btn"
          id="flip-btn"
          title="Flip camera"
          aria-label="Flip camera"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M1 4v6h6" />
            <path d="M23 20v-6h-6" />
            <path
              d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"
            />
          </svg>
        </button>

        <!-- Shutter + mode toggle -->
        <div class="shutter-wrap">
          <div class="mode-toggle" role="group" aria-label="Capture mode">
            <button class="mode-btn active" id="pill-photo" aria-pressed="true">
              PHOTO
            </button>
            <button class="mode-btn" id="pill-video" aria-pressed="false">
              VIDEO
            </button>
          </div>
          <button class="shutter" id="shutter-btn" aria-label="Capture">
            <div class="shutter-inner"></div>
          </button>
        </div>

        <!-- Album -->
        <button
          class="cam-side-btn"
          id="album-btn"
          title="View album"
          aria-label="View album"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ════════════════════════════════════════
     PREVIEW SCREEN
════════════════════════════════════════ -->
    <div id="preview-screen" class="screen">
      <div class="preview-bar">
        <div class="preview-bar-title">Review</div>
        <button class="btn-ghost" id="discard-btn">Discard</button>
      </div>

      <div id="preview-media-wrap">
        <img id="preview-img" alt="Photo preview" style="display: none" />
        <video id="preview-vid" controls style="display: none"></video>
      </div>

      <div class="preview-actions">
        <button class="btn-outline" id="retake-btn">Retake</button>
        <button class="btn-save" id="upload-btn">Upload</button>
      </div>
    </div>

    <!-- ════════════════════════════════════════
     ALBUM SCREEN
════════════════════════════════════════ -->
    <div id="album-screen" class="screen">
      <div class="album-bar">
        <div class="album-bar-title" id="album-bar-title"></div>
        <button class="btn-camera" id="take-more-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            />
            <circle cx="12" cy="13" r="4" />
          </svg>
          Take More
        </button>
      </div>

      <div class="album-body">
        <div id="gallery-empty" class="album-embed-card" hidden>
          <div class="album-icon">📷</div>
          <div class="album-card-title">No photos yet</div>
          <div class="album-card-sub">Be the first — take a shot!</div>
        </div>

        <div id="gallery-grid" class="gallery-grid"></div>

        <div id="gallery-status" class="gallery-status" hidden>
          <div class="spinner"></div>
          <div id="gallery-status-text" class="gallery-status-text"></div>
        </div>
        <div id="gallery-sentinel" aria-hidden="true"></div>

        <div class="album-stats">
          <div class="stat-card">
            <div class="stat-val" id="stat-shots">0</div>
            <div class="stat-label">Your Shots</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">∞</div>
            <div class="stat-label">Limit</div>
          </div>
        </div>

        <a
          id="open-photos-btn"
          class="album-footer-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open in Google Photos ↗
        </a>
      </div>
    </div>

    <!-- Utility elements -->
    <div id="flash" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <canvas id="canvas" aria-hidden="true"></canvas>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
